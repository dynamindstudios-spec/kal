<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAL DISCOBAR - Terminal Offline de Contingencia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a10;
      --card: #11131e;
      --card-alt: #161928;
      --border: #23273c;
      --gold: #ffcc00;
      --gold-glow: rgba(255, 204, 0, 0.25);
      --red: #ef4444;
      --green: #10b981;
      --text: #f3f4f6;
      --text-dim: #9ca3af;
      --font: 'Outfit', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      background: rgba(255, 204, 0, 0.15);
      border: 1px solid rgba(255, 204, 0, 0.35);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    h1 {
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #fff;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 4px 10px;
      border-radius: 12px;
      text-transform: uppercase;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel-title {
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
    }
    input, select {
      width: 100%;
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      color: #fff;
      font-family: var(--font);
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 10px var(--gold-glow);
    }
    .mono-input {
      font-family: var(--mono);
      font-weight: 700;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .btn {
      padding: 12px 18px;
      border-radius: 16px;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-gold {
      background: linear-gradient(135deg, #ffcc00, #e6b800);
      color: #000;
      box-shadow: 0 4px 15px rgba(255, 204, 0, 0.25);
    }
    .btn-gold:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-dark {
      background: var(--card-alt);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-dark:hover {
      border-color: var(--gold);
      color: #fff;
    }
    .btn-red {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }
    .btn-red:hover {
      background: rgba(239, 68, 68, 0.3);
    }
    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .preset-btn {
      background: var(--card-alt);
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 10px;
      padding: 6px 4px;
      font-size: 10px;
      font-family: var(--mono);
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .preset-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
    .invoices-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .invoice-card {
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .invoice-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .invoice-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tag {
      background: rgba(255, 204, 0, 0.15);
      color: var(--gold);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .location {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }
    .invoice-detail {
      font-size: 11px;
      color: var(--text-dim);
    }
    .invoice-price {
      text-align: right;
    }
    .price-num {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 900;
      color: var(--gold);
    }
    .price-method {
      font-size: 10px;
      color: var(--text-dim);
    }
    .total-box {
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .actions-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10b981;
      color: #000;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 900;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: none;
      animation: fadeIn 0.3s;
      z-index: 9999;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="container">
  
  <!-- Header -->
  <div class="header">
    <div class="header-title">
      <div class="icon-box">🍸</div>
      <div>
        <h1>KAL DISCOBAR • Terminal Offline</h1>
        <p style="font-size: 11px; color: var(--text-dim);">Emisión y registro de facturas físicas de talonario sin internet</p>
      </div>
    </div>
    <div class="badge">Modo Offline Activo</div>
  </div>

  <!-- Grid -->
  <div class="grid">
    
    <!-- Formulario de Emisión -->
    <div class="panel">
      <div class="panel-title">
        <span>+ Nueva Factura Manual</span>
        <span style="font-size: 11px; color: var(--gold);">Talonario Físico</span>
      </div>

      <form id="invoiceForm" onsubmit="handleAddInvoice(event)">
        <div class="row-2">
          <div class="form-group">
            <label>N° Talonario *</label>
            <input type="text" id="invNum" class="mono-input" required placeholder="TAL-1001">
          </div>
          <div class="form-group">
            <label>Monto COP *</label>
            <input type="number" id="invTotal" class="mono-input" required placeholder="180000">
          </div>
        </div>

        <!-- Presets -->
        <div class="form-group">
          <label>Montos Rápidos:</label>
          <div class="presets">
            <button type="button" class="preset-btn" onclick="setTotal(50000)">$50k</button>
            <button type="button" class="preset-btn" onclick="setTotal(100000)">$100k</button>
            <button type="button" class="preset-btn" onclick="setTotal(200000)">$200k</button>
            <button type="button" class="preset-btn" onclick="setTotal(350000)">$350k</button>
          </div>
        </div>

        <div class="row-2">
          <div class="form-group">
            <label>Medio de Pago</label>
            <select id="invMethod">
              <option value="Efectivo">💵 Efectivo</option>
              <option value="Transferencia Bancolombia">🏦 Bancolombia</option>
              <option value="Nequi">📱 Nequi</option>
              <option value="Daviplata">📲 Daviplata</option>
              <option value="Datáfono / Tarjeta">💳 Datáfono / Tarjeta</option>
            </select>
          </div>
          <div class="form-group">
            <label>Mesa o Barra</label>
            <select id="invTable">
              <option value="Barra">🍸 Barra Mostrador</option>
              <option value="Mesa 1">🛎️ Mesa 1</option>
              <option value="Mesa 2">🛎️ Mesa 2</option>
              <option value="Mesa 3">🛎️ Mesa 3</option>
              <option value="Mesa 4">🛎️ Mesa 4</option>
              <option value="Mesa 5">🛎️ Mesa 5</option>
              <option value="Mesa 6">🛎️ Mesa 6</option>
              <option value="Mesa 7">🛎️ Mesa 7</option>
              <option value="Mesa 8">🛎️ Mesa 8</option>
              <option value="Mesa 9">🛎️ Mesa 9</option>
              <option value="Mesa 10">🛎️ Mesa 10</option>
              <option value="Mesa 11">🛎️ Mesa 11</option>
              <option value="Mesa 12">🛎️ Mesa 12</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Motivo / Observación</label>
          <input type="text" id="invNotes" placeholder="Falla temporal de red wifi / Corte de luz">
        </div>

        <button type="submit" class="btn btn-gold" style="width: 100%; margin-top: 6px;">
          💾 Guardar Factura Local
        </button>
      </form>
    </div>

    <!-- Registro & Acciones de Sincronización -->
    <div class="panel">
      <div class="panel-title">
        <span>Facturas Pendientes de Subir</span>
        <span id="countBadge" style="font-family: var(--mono); color: var(--gold);">0 facturas</span>
      </div>

      <div class="total-box">
        <div>
          <span style="font-size: 11px; color: var(--text-dim); text-transform: uppercase;">Total Acumulado Offline:</span>
          <div id="totalCOPDisplay" class="price-num" style="font-size: 20px;">$0 COP</div>
        </div>
        <button type="button" onclick="clearQueue()" class="btn btn-red" style="padding: 6px 12px; font-size: 10px;">
          Vaciar
        </button>
      </div>

      <!-- Lista -->
      <div id="invoicesList" class="invoices-list">
        <div style="text-align: center; color: var(--text-dim); font-size: 12px; padding: 40px 0;">
          No hay facturas offline registradas.
        </div>
      </div>

      <!-- Sincronización -->
      <div class="actions-bar">
        <button type="button" onclick="exportData()" class="btn btn-dark" style="flex: 1;">
          📥 Exportar Archivo
        </button>
        <button type="button" onclick="copySyncCode()" class="btn btn-dark" style="flex: 1;">
          📋 Copiar Código
        </button>
      </div>

      <button type="button" onclick="pushToServer()" class="btn btn-gold" style="width: 100%;">
        ⚡ Sincronizar con el Dashboard
      </button>
    </div>

  </div>
</div>

<div id="toast" class="toast">¡Mensaje!</div>

<script>
  const STORAGE_KEY = 'kal_contingency_offline_queue';

  function getQueue() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveQueue(queue) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(queue));
    render();
  }

  function setTotal(amount) {
    document.getElementById('invTotal').value = amount;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3000);
  }

  function handleAddInvoice(e) {
    e.preventDefault();
    const num = document.getElementById('invNum').value.trim();
    const tot = parseFloat(document.getElementById('invTotal').value) || 0;
    const method = document.getElementById('invMethod').value;
    const table = document.getElementById('invTable').value;
    const notes = document.getElementById('invNotes').value.trim() || 'Contingencia Offline';

    if (!num || tot <= 0) return;

    const queue = getQueue();
    queue.unshift({
      id: 'offline-' + Date.now(),
      invoiceNumber: num,
      totalCOP: tot,
      paymentMethod: method,
      tableNumber: table,
      notes: notes,
      createdAt: new Date().toISOString()
    });

    saveQueue(queue);
    showToast(`✅ Factura ${num} guardada correctamente`);

    // Siguiente número de talonario sugerido
    const match = num.match(/\d+/);
    if (match) {
      const nextNum = parseInt(match[0], 10) + 1;
      document.getElementById('invNum').value = num.replace(/\d+/, String(nextNum));
    }
    document.getElementById('invTotal').value = '';
    document.getElementById('invNotes').value = '';
  }

  function deleteInvoice(id) {
    const queue = getQueue().filter(i => i.id !== id);
    saveQueue(queue);
  }

  function clearQueue() {
    if (confirm('¿Deseas vaciar todas las facturas guardadas en este equipo?')) {
      saveQueue([]);
      showToast('🗑️ Cola vaciada');
    }
  }

  function exportData() {
    const queue = getQueue();
    if (queue.length === 0) {
      alert('No hay facturas offline para exportar.');
      return;
    }
    
    // Generar formato compatible con el Dashboard
    let text = `# FACTURAS DE CONTINGENCIA KAL DISCOBAR - EXPORTADO EL ${new Date().toLocaleString()}\n`;
    text += `# NroFactura | MontoCOP | MedioPago | MesaOBarra | Motivo\n\n`;
    queue.forEach(i => {
      text += `${i.invoiceNumber} | ${i.totalCOP} | ${i.paymentMethod} | ${i.tableNumber} | ${i.notes}\n`;
    });

    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Facturas_Offline_KAL_${Date.now()}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('💾 Archivo descargado para subir al Dashboard');
  }

  function copySyncCode() {
    const queue = getQueue();
    if (queue.length === 0) {
      alert('No hay facturas offline para copiar.');
      return;
    }
    let text = '';
    queue.forEach(i => {
      text += `${i.invoiceNumber} | ${i.totalCOP} | ${i.paymentMethod} | ${i.tableNumber} | ${i.notes}\n`;
    });
    navigator.clipboard.writeText(text).then(() => {
      showToast('📋 Código copiado. Puedes pegarlo en el Dashboard');
    });
  }

  function pushToServer() {
    const queue = getQueue();
    if (queue.length === 0) {
      alert('No hay facturas offline para sincronizar.');
      return;
    }

    // Intentar sincronización directa mediante localStorage compartido del navegador o archivo
    try {
      const existing = JSON.parse(localStorage.getItem('kal_admin_contingency_invoices')) || [];
      queue.forEach(q => {
        if (!existing.some(e => e.invoiceNumber === q.invoiceNumber)) {
          existing.unshift(q);
        }
      });
      localStorage.setItem('kal_admin_contingency_invoices', JSON.stringify(existing));
      showToast(`⚡ ¡${queue.length} facturas sincronizadas con el panel!`);
      setTimeout(() => {
        if (confirm('Facturas registradas en el panel. ¿Deseas vaciar la cola offline?')) {
          saveQueue([]);
        }
      }, 500);
    } catch (e) {
      exportData();
    }
  }

  function render() {
    const queue = getQueue();
    const list = document.getElementById('invoicesList');
    const badge = document.getElementById('countBadge');
    const totalDisplay = document.getElementById('totalCOPDisplay');

    badge.innerText = `${queue.length} facturas`;
    const total = queue.reduce((sum, i) => sum + (Number(i.totalCOP) || 0), 0);
    totalDisplay.innerText = `$${total.toLocaleString('es-CO')} COP`;

    if (queue.length === 0) {
      list.innerHTML = `<div style="text-align: center; color: var(--text-dim); font-size: 12px; padding: 40px 0;">No hay facturas offline registradas.</div>`;
      return;
    }

    list.innerHTML = queue.map(i => `
      <div class="invoice-card">
        <div class="invoice-info">
          <div class="invoice-top">
            <span class="tag">${i.invoiceNumber}</span>
            <span class="location">${i.tableNumber}</span>
          </div>
          <span class="invoice-detail">${i.notes}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="invoice-price">
            <div class="price-num">$${Number(i.totalCOP).toLocaleString('es-CO')}</div>
            <div class="price-method">${i.paymentMethod}</div>
          </div>
          <button onclick="deleteInvoice('${i.id}')" style="background: none; border: none; color: #ef4444; cursor: pointer; font-size: 14px;">✕</button>
        </div>
      </div>
    `).join('');
  }

  // Init
  document.getElementById('invNum').value = 'TAL-' + Math.floor(1000 + Math.random() * 9000);
  render();
</script>

</body>
</html>
